appId: com.auri.app
productName: Auri
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - '!{docs,.quality,.vite-plus}/**'
  - '!vite.config.{js,ts,mjs,cjs}'
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!resources/brand/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl}-*'
  - '!node_modules/node-addon-api/**'
  - '!node_modules/sodium-native/prebuilds/{android,ios,linux}-*'
  - '!node_modules/udx-native/prebuilds/{android,ios,linux}-*'
asarUnpack:
  - resources/**
npmRebuild: false
win:
  executableName: Auri
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.medical
  entitlementsInherit: build/entitlements.mac.plist
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
publish:
  provider: generic
  url: https://atualizacoes.auri.dev.br/
generateUpdatesFilesForAllChannels: true
