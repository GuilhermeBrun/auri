version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    groups:
      vite-plus:
        patterns: ['vite-plus', 'vite', '@voidzero-dev/*']
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Cuiaba
    open-pull-requests-limit: 3
    groups:
      vite-plus:
        patterns: ['vite-plus', 'vite', '@voidzero-dev/*']
      site:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci(deps)'
