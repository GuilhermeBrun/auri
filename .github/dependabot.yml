version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    groups:
      # O Vite+ junto com o core (o alias do vite). O Dependabot não muda o "overrides" do
      # package.json: no PR dele, rodar `npx vp migrate --no-interactive` na pasta, que acerta o
      # alias para a versão nova.
      vite-plus:
        patterns: ['vite-plus', 'vite', '@voidzero-dev/*']
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    # Os tipos do Node acompanham o Node que roda o código: o do Electron (24 até o 44) no app e o do
    # CI (24.15) nos scripts e no site. Subir quando o Electron e o setup-deps passarem para o 26.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Cuiaba
    open-pull-requests-limit: 3
    groups:
      # Como no /desktop.
      vite-plus:
        patterns: ['vite-plus', 'vite', '@voidzero-dev/*']
      site:
        update-types: [minor, patch]
    # Tipos do Node na major do Node do CI (ver o /desktop).
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci(deps)'
