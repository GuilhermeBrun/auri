name: Preparar dependências
description: Node fixo e node_modules em cache (Electron e SQLite já compilados) pela chave do lockfile.

inputs:
  directory:
    description: Pasta do projeto (desktop ou web), com o package.json e o package-lock.json.
    default: desktop

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - id: lockfile
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: >-
        node -e "const l = require('./package-lock.json'); delete l.version; delete l.packages[''].version;
        require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'hash=' + require('crypto').createHash('sha256').update(JSON.stringify(l)).digest('hex') + '\\n')"
    - id: modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.directory }}/node_modules
        key: modules-${{ inputs.directory }}-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ steps.lockfile.outputs.hash }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: npm ci || npm ci
