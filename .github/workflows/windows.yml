name: Windows

# Teste manual no sistema da clínica (e no Mac, se marcado): o Auri aberto de verdade, a interface,
# o pacote, o instalador e os instaladores oficiais das nuvens. Não roda sozinho: o PR é validado
# pelo CI e o uso real vem do beta.
#
#   gh workflow run windows.yml --ref <branch>
#   gh workflow run windows.yml --ref <branch> -f macos=true
on:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Rodar também no macOS (custa 10x o minuto do Linux)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.macos && fromJSON('["win32","darwin"]') || fromJSON('["win32"]') }}
    runs-on: ${{ matrix.platform == 'win32' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - run: npm test
      - name: Instaladores oficiais das nuvens (download e assinatura)
        run: npm test -- src/main/backup/installer.test.ts
        env:
          AURI_TESTA_INSTALADORES: '1'
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:ui
      - run: npm run build:unpack
      - run: npm run test:package
      - name: Gerar e testar o instalador
        shell: bash
        run: |
          npm run ${{ matrix.platform == 'win32' && 'build:win' || 'build:mac' }}
          npm run test:installer
      # No Windows também baixa e roda o instalador oficial do Google Drive (máquina descartável).
      - name: E2E com instalação real
        run: node scripts/e2e.mjs e2e-saida
        env:
          AURI_E2E_INSTALAR: ${{ matrix.platform == 'win32' && '1' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-${{ matrix.platform }}
          path: |
            .quality/
            e2e-saida/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
