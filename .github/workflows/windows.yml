name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (win32)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - run: npm test
      - name: Instaladores oficiais das nuvens (download e assinatura)
        run: npm test -- src/main/backup/installer.test.ts
        env:
          AURI_TESTA_INSTALADORES: '1'
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:ui
      - run: npm run build:unpack
      - run: npm run test:package
      - name: Gerar e testar o instalador
        shell: bash
        run: |
          npm run build:win
          npm run test:installer
      - name: E2E com instalação real
        run: node scripts/e2e.mjs e2e-saida
        env:
          AURI_E2E_INSTALAR: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-win32
          path: |
            desktop/.quality/
            desktop/e2e-saida/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
