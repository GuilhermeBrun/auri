name: CI

# Cada PR e push em main, em ~2 min. Roda em Ubuntu só por ser a máquina mais rápida e barata do
# Actions: o Auri é testado no Windows e no Mac pelo workflow Windows (manual) e por quem usa o beta.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      # Formato, lint e tipos (Vite+).
      - run: npm run check
      - name: Código não usado
        run: npm run knip

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - run: npm test

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Versões do beta e da estável, arquivos do site de atualização
        run: node --test scripts/release/*.test.mjs

  # A proteção do main exige só este job, pelo nome `Check`. Ele reprova quando qualquer outro
  # falha, é cancelado ou pulado: novos jobs entram em `needs` sem mexer na proteção.
  check:
    name: Check
    if: always()
    needs: [lint, build, test, release_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir sucesso de todos os jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
