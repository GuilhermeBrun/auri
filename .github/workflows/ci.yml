name: CI

# Cada PR pronto para revisão e push em main, em ~3 min. Roda em Ubuntu só por ser a máquina mais
# barata do Actions: o Auri é testado no Windows pelo workflow Windows (manual), no Mac pelo
# `npm run ci:mac` e por quem usa o beta. Os passos são os do `npm run ci:local`, que o hook de
# pre-push roda em cada push: o rascunho fica só nele e o Actions confere quando o PR fica pronto.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Um job só: cada job paga de novo checkout, Node e cache, e o Actions arredonda cada um para o
  # minuto inteiro. A proteção do main exige este job pelo nome `Check`. No rascunho ele é pulado,
  # e um rascunho não pode ser mesclado; ao ficar pronto (`ready_for_review`), roda de verdade.
  check:
    name: Check
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deps
        uses: ./.github/actions/setup-deps
      # Cada passo roda mesmo se o anterior falhar, para o PR mostrar todos os erros de uma vez.
      - name: 'Lint: formato, lint e tipos'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check
      - name: 'Lint: código não usado'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run knip
      - name: Build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build
      - name: Test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test
      - name: 'Release Smoke: versões do beta e da estável, arquivos do site de atualização'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node --test scripts/release/*.test.mjs
