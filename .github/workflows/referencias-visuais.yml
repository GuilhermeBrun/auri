name: Referências visuais

# Gera as capturas do Windows e do macOS para a branch escolhida, sem aprovar nada: o resultado
# vira artefato e `npm run visual:aceitar` traz as imagens para docs/qualidade/visual. Depois de
# conferir o diff das imagens, o commit passa pelo CI normal.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: referencias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: capture (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      # Chave sem o campo version do app: um PR que só sobe a versão mantém o cache.
      - id: lockfile
        shell: bash
        run: >-
          node -e "const l = require('./package-lock.json'); delete l.version; delete l.packages[''].version;
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'hash=' + require('crypto').createHash('sha256').update(JSON.stringify(l)).digest('hex') + '\\n')"
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ steps.lockfile.outputs.hash }}
      # Uma nova tentativa: o download do Electron às vezes cai no meio.
      - if: steps.modules.outputs.cache-hit != 'true'
        shell: bash
        run: npm ci || npm ci
      - run: npm run build
      - run: npm run test:ui
        env:
          AURI_UPDATE_VISUAL: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: referencias-${{ matrix.platform }}
          path: .quality/ui/reference/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
