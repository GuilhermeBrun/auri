name: Release

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal'
        type: choice
        options: [alpha, stable, site]
        default: alpha
      version:
        description: 'Versão estável (ex.: 1.2.0). Vazio: a base do último alpha.'
        type: string
        default: ''
      mac:
        description: 'Alpha também no Mac (a estável sempre sai nos dois)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolver versão
    if: inputs.channel != 'site'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - id: resolve
        run: node scripts/release/cli.mjs resolve
        env:
          CHANNEL: ${{ inputs.channel || 'alpha' }}
          VERSION_INPUT: ${{ inputs.version }}

  build:
    name: build (${{ matrix.platform }})
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ (needs.resolve.outputs.prerelease != 'true' || inputs.mac) && fromJSON('["win32","darwin"]') || fromJSON('["win32"]') }}
    runs-on: ${{ matrix.platform == 'win32' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - name: Gravar a versão
        run: npm version ${{ needs.resolve.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Gerar o instalador
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          if [ "$PLATFORM" = win32 ]; then
            npm run build:win
          elif [ -n "$CSC_LINK" ] && [ -n "$APPLE_TEAM_ID" ]; then
            npm run build:mac -- -c.mac.identity="$APPLE_TEAM_ID" -c.mac.hardenedRuntime=true
          else
            echo "::warning::Sem os segredos da Apple: o Mac sai com assinatura ad-hoc e não se atualiza sozinho."
            npm run build:mac
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auri-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/*.yml
            !desktop/dist/builder-debug.yml
            !desktop/dist/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 1
      - if: matrix.platform == 'win32'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapas
          path: desktop/out/**/*.map
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publicar release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: auri-*
          path: entrega
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mapas
          path: mapas/out
      - name: Juntar os mapas do código
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: cd mapas && zip -qr "../entrega/auri-${VERSION}-sourcemaps.zip" out
      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REF: ${{ needs.resolve.outputs.ref }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          ls -la entrega
          flags=(--target "$REF" --generate-notes --title "Auri ${TAG#v}")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" entrega/*

  atualizacao:
    name: Atualização
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || inputs.channel == 'site') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Atualizar o site na Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Sem VERCEL_DEPLOY_HOOK: o site e o feed de atualização ficam na versão anterior."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
