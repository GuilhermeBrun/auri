name: Qualidade

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_SHA: ${{ github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
  TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Decididos pelo verificador da base: o que ele não vai exigir, os checks não rodam.
    # Vazios (verificador antigo) significam rodar tudo.
    outputs:
      packaging: ${{ steps.policy.outputs.packaging }}
      mutation: ${{ steps.policy.outputs.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Carregar verificador da base aprovada
        shell: bash
        run: |
          mkdir -p .quality/trusted
          if git cat-file -e "$TRUSTED_SHA:docs/qualidade/testes.json" 2>/dev/null; then
            git archive "$TRUSTED_SHA" scripts/quality docs/qualidade | tar -x -C .quality/trusted
          else
            echo 'Base aprovada indisponível; bootstrap automático desativado.' >&2
            exit 1
          fi
      - name: Testar também o verificador aprovado
        run: node --test .quality/trusted/scripts/quality/*.test.mjs
      - name: Conferir integridade da política
        id: policy
        run: node .quality/trusted/scripts/quality/cli.mjs policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-policy
          path: |
            .quality/policy.json
            .quality/trusted/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  checks:
    name: checks (${{ matrix.platform }})
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      # node_modules inteiro (Electron e SQLite já compilados): no Windows o npm ci levava ~2 min.
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check
      - run: npm run test:quality
      - run: npm run test:ci
      - run: npm run test:coverage-changed
      - run: npm run build
      - run: npm run test:performance
      - run: npm run test:e2e
      - run: npm run test:ui
      - if: matrix.platform == 'darwin' || needs.policy.outputs.mutation != 'darwin'
        run: npm run test:mutation
      - if: needs.policy.outputs.packaging != 'false'
        run: npm run build:unpack
      - if: needs.policy.outputs.packaging != 'false'
        run: npm run test:package
      - if: needs.policy.outputs.packaging != 'false'
        run: npm run quality:delivery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-${{ matrix.platform }}
          path: .quality/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  security:
    name: security
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - run: python -m pip install semgrep==1.180.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-policy
          path: .quality/policy-source
      - run: npm ci --ignore-scripts
      - name: Audit e scan de segredos com política da base
        run: node .quality/policy-source/trusted/scripts/quality/security.mjs
      - name: SAST e provas das regras
        run: npm run security:sast
        env:
          AURI_SAST_POLICY: .quality/policy-source/trusted/docs/qualidade/sast.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-security
          path: .quality/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: quality
    if: always()
    needs: [policy, checks, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Exigir sucesso de todos os jobs
        env:
          QUALITY_JOBS: ${{ toJSON(needs) }}
        run: |
          node -e "const jobs=JSON.parse(process.env.QUALITY_JOBS);for(const name of ['policy','checks','security']){if(jobs[name]?.result!=='success')throw new Error(name+': '+jobs[name]?.result)}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-*
          path: evidence
      - name: Validar relatórios e cenários com verificador da base
        run: node evidence/quality-policy/trusted/scripts/quality/cli.mjs aggregate evidence
        env:
          QUALITY_JOBS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-summary
          path: evidence/summary.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
