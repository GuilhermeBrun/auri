name: Build

# Gera e testa os instaladores em cada sistema (inclusive no Windows, onde o app não pode ser
# testado a partir do Mac). Numa tag vX.Y.Z também publica a release.
#
# Não repete o Qualidade: a tag só é aceita no commit atual de main com o Qualidade aprovado no
# push (release-policy.mjs). Execução manual gera artefatos para conferir, sem publicar.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  origin:
    name: origem aprovada
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Conferir origem aprovada da versão
        run: node scripts/quality/release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: origin
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            script: build:win
          - os: macos-latest
            platform: darwin
            script: build:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # Chave sem o campo version do app: um PR que só sobe a versão mantém o cache.
      - id: lockfile
        shell: bash
        run: >-
          node -e "const l = require('./package-lock.json'); delete l.version; delete l.packages[''].version;
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'hash=' + require('crypto').createHash('sha256').update(JSON.stringify(l)).digest('hex') + '\\n')"
      # O mesmo cache do Qualidade, só leitura: quem grava é o push em main.
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ steps.lockfile.outputs.hash }}
      # Uma nova tentativa: o download do Electron às vezes cai no meio.
      - if: steps.modules.outputs.cache-hit != 'true'
        shell: bash
        run: npm ci || npm ci

      - name: Instaladores oficiais das nuvens (download e assinatura)
        run: npm test -- src/main/backup/installer.test.ts
        env:
          AURI_TESTA_INSTALADORES: '1'

      # `--publish never`: o instalador sai com o endereço de atualização (electron-builder.yml),
      # mas quem publica é o job pages, depois de todos os testes.
      - name: Gerar o instalador
        run: npm run ${{ matrix.script }}

      - name: Testar o instalador e o aplicativo distribuído
        run: npm run test:installer
      - name: Inventariar o mesmo pacote e instalador aprovados
        run: npm run quality:delivery -- --installer

      # O Auri aberto de verdade (janela, IPC, banco, disco). No Windows também baixa e roda o
      # instalador oficial do Google Drive (a máquina do CI é descartável).
      - name: E2E com instalação real
        run: node scripts/e2e.mjs e2e-saida
        env:
          AURI_E2E_INSTALAR: ${{ matrix.platform == 'win32' && '1' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-${{ matrix.platform }}
          path: |
            .quality/
            e2e-saida/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auri-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest*.yml
            .quality/delivery/
          overwrite: true
          if-no-files-found: error

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: auri-*
          path: entrega
          merge-multiple: true

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(entrega/dist/*.exe entrega/dist/*.dmg entrega/dist/*.blockmap entrega/dist/latest*.yml)
          gh release create "$TAG" --verify-tag --generate-notes --title "Auri ${TAG#v}" "${files[@]}"

  # O repositório é privado: o Auri instalado procura versões novas no Pages, que é público e
  # publicado só com o token do próprio workflow. Fica só a versão atual, com uma página de
  # download para instalar à mão (Mac, ou um computador novo).
  pages:
    name: atualização
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: auri-*
          path: entrega
          merge-multiple: true

      - name: Montar o site de atualização
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir site
          shopt -s nullglob
          cp entrega/dist/*.exe entrega/dist/*.dmg entrega/dist/*.blockmap entrega/dist/latest*.yml site/
          test -f site/latest.yml || { echo 'latest.yml ausente: confira o publish do electron-builder.yml.'; exit 1; }
          {
            echo '<!doctype html><html lang="pt-BR"><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo "<title>Auri ${TAG#v}</title>"
            echo '<body style="font-family:system-ui,sans-serif;max-width:560px;margin:48px auto;padding:0 16px">'
            echo "<h1>Auri ${TAG#v}</h1><ul>"
            for file in site/*.exe site/*.dmg; do
              name=$(basename "$file")
              echo "<li><a href=\"$name\">$name</a></li>"
            done
            echo '</ul><p>No Windows o Auri instalado se atualiza sozinho.</p></body></html>'
          } > site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
