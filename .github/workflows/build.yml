name: Build

# Gera os instaladores e roda os testes em cada sistema (inclusive no Windows,
# onde o app não pode ser testado a partir do Mac).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validation:
    uses: ./.github/workflows/quality.yml

  build:
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: dist/*.exe
          - os: macos-latest
            script: build:mac
            artifact: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm

      - run: npm install --global npm@11.13.0
      - run: npm ci

      - name: Conferir origem aprovada da versão
        run: node scripts/quality/release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - run: npm test
        env:
          # baixa os instaladores oficiais e confere a assinatura (no Windows)
          AURI_TESTA_INSTALADORES: '1'

      - run: npm run ${{ matrix.script }}

      - name: Testar o instalador e o aplicativo distribuído
        run: npm run test:installer
      - name: Inventariar o mesmo pacote e instalador aprovados
        run: npm run quality:delivery -- --installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installer-${{ matrix.os }}
          path: .quality/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auri-${{ matrix.os }}
          path: |
            ${{ matrix.artifact }}
            .quality/delivery/
          overwrite: true
          if-no-files-found: error

  # O Auri aberto de verdade (janela, IPC, banco, disco), dirigido pelo protocolo do DevTools. No
  # Windows também baixa e roda o instalador oficial do Google Drive (a máquina do CI é descartável).
  e2e:
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm

      - run: npm install --global npm@11.13.0
      - run: npm ci

      - run: npm run build

      - run: node scripts/e2e.mjs e2e-saida
        env:
          AURI_E2E_INSTALAR: ${{ matrix.os == 'windows-latest' && '1' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-saida
          overwrite: true
