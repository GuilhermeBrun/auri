name: Revisão da política

# A revisão "quality-policy-reviewed: <SHA>" só vale numa nova tentativa do Qualidade (o check
# `quality` fica preso ao resultado da tentativa anterior). Aqui a nova tentativa sai sozinha,
# no lugar do "Re-run all jobs" manual. Quem confere a revisão continua sendo o verificador da base.
on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.review.body == format('quality-policy-reviewed: {0}', github.event.pull_request.head.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Reexecutar o Qualidade do mesmo commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh run list --workflow quality.yml --event pull_request --commit "$HEAD_SHA" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then
            echo "Nenhuma execução do Qualidade para $HEAD_SHA."
            exit 0
          fi
          # Uma tentativa em andamento precisa terminar antes de poder ser repetida.
          gh run watch "$id" --interval 30 > /dev/null || true
          if [ "$(gh run view "$id" --json conclusion --jq .conclusion)" = success ]; then
            echo "Qualidade já aprovado nesse commit."
            exit 0
          fi
          gh run rerun "$id"
          echo "Nova tentativa do Qualidade: $(gh run view "$id" --json url --jq .url)"
