appId: com.auri.app
productName: Auri
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - '!{docs,reports,research_notes,.github,.quality,.vite-plus}/**'
  - '!vite.config.{js,ts,mjs,cjs}'
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!resources/brand/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl}-*'
  - '!node_modules/node-addon-api/**'
  # criptografia da conexão entre computadores: só os binários de Mac e Windows
  - '!node_modules/sodium-native/prebuilds/{android,ios,linux}-*'
  - '!node_modules/udx-native/prebuilds/{android,ios,linux}-*'
asarUnpack:
  - resources/**
# O better-sqlite3 já vem com binários prontos (Node-API) para cada sistema em
# prebuilds/, então não há nada a recompilar; isso também permite gerar o .exe no Mac.
npmRebuild: false
win:
  executableName: Auri
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.medical
  entitlementsInherit: build/entitlements.mac.plist
  # Sem certificado (build local, teste manual, fork), a assinatura é ad-hoc: o pacote fica
  # íntegro (sem ela, um .dmg baixado abre como "danificado"), mas o macOS não troca o app
  # sozinho. O Release, com os segredos da Apple, troca por `-c.mac.identity=<Team ID>` e
  # `-c.mac.hardenedRuntime=true`, assina com o Developer ID e notariza (APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD e APPLE_TEAM_ID). Sem essas variáveis, a notarização é pulada.
  # Ver docs/ci.md.
  identity: '-'
  # O hardened runtime é exigido para notarizar; com assinatura ad-hoc ele impediria o
  # carregamento do binário do SQLite (validação de biblioteca), então só liga com o Developer ID.
  hardenedRuntime: false
  # O .zip é o que o Auri instalado baixa para se atualizar (latest-mac.yml); o .dmg é para instalar.
  # Só Apple Silicon: a clínica não tem Mac Intel, e cada arquitetura dobra o tempo (pago a 10x)
  # do build do Mac no Release.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
# Onde o Auri instalado procura versões novas: o GitHub Pages deste repositório, que o Release
# publica (ver docs/ci.md). latest.yml é a estável e alpha.yml o canal alpha.
publish:
  provider: generic
  url: https://auri.dev.br/
# A estável também escreve alpha.yml: quem está no alpha recebe a estável quando ela é mais nova.
generateUpdatesFilesForAllChannels: true
